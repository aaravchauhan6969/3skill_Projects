<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master | Frontend Quiz App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <!-- Background Overlay -->
    <div class="overlay"></div>

    <!-- ===================== NAVBAR ===================== -->

    <nav>

        <div class="logo">

            <img src="quiz.svg" alt="Quiz Logo">

            <h2>Quiz Master</h2>

        </div>

        <button id="themeBtn">

            <i class="fa-solid fa-moon"></i>

        </button>

    </nav>

    <!-- ===================== WELCOME SCREEN ===================== -->

    <section id="welcomeScreen" class="screen active">

        <div class="card welcome-card">

            <img src="quiz.svg" class="welcome-image" alt="Quiz Image">

            <h1>Frontend Quiz Challenge</h1>

            <p>
                Test your knowledge of HTML, CSS & JavaScript
                with fun and interactive questions.
            </p>

            <div class="input-group">

                <label>Your Name</label>

                <input
                    type="text"
                    id="playerName"
                    placeholder="Enter your name">

            </div>

            <div class="input-group">

                <label>Category</label>

                <select id="category">

                    <option>HTML</option>

                    <option>CSS</option>

                    <option selected>Frontend Mix</option>

                    <option>JavaScript</option>

                </select>

            </div>

            <div class="input-group">

                <label>Difficulty</label>

                <select id="difficulty">

                    <option>Easy</option>

                    <option selected>Medium</option>

                    <option>Hard</option>

                </select>

            </div>

            <button id="startQuiz" class="primary-btn">

                Start Quiz

            </button>

        </div>

    </section>

    <!-- ===================== QUIZ SCREEN ===================== -->

    <section id="quizScreen" class="screen">

        <div class="quiz-container">

            <!-- Top Bar -->

            <div class="top-bar">

                <div>

                    <h3 id="questionCounter">

                        Question 1 / 10

                    </h3>

                    <p id="playerDisplay"></p>

                </div>

                <div class="timer-box">

                    <i class="fa-solid fa-clock"></i>

                    <span id="timer">

                        20

                    </span>

                </div>

            </div>

            <!-- Progress -->

            <div class="progress">

                <div id="progressBar"></div>

            </div>

            <!-- Question Card -->

            <div class="card question-card">

                <h2 id="question">

                    Question appears here...

                </h2>

                <div class="options">

                    <button class="option-btn"></button>

                    <button class="option-btn"></button>

                    <button class="option-btn"></button>

                    <button class="option-btn"></button>

                </div>

            </div>

            <!-- Navigation Buttons -->

            <div class="navigation">

                <button
                    id="prevBtn"
                    class="secondary-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Previous

                </button>

                <button
                    id="nextBtn"
                    class="primary-btn">

                    Next

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </div>

        </div>

    </section>

    <!-- ===================== RESULT SCREEN ===================== -->

    <section id="resultScreen" class="screen">

        <div class="card result-card">

            <img
                src="trophy.png"
                alt="Trophy"
                class="trophy">

            <h1>

                Congratulations!

            </h1>

            <h2 id="resultName">

                Player Name

            </h2>

            <div class="score-circle">

                <span id="score">

                    0 / 10

                </span>

            </div>

            <div class="stats">

                <div>

                    <h3>Correct</h3>

                    <p id="correctCount">0</p>

                </div>

                <div>

                    <h3>Wrong</h3>

                    <p id="wrongCount">0</p>

                </div>

                <div>

                    <h3>High Score</h3>

                    <p id="highScore">0</p>

                </div>

            </div>

            <div class="result-buttons">

                <button
                    id="restartQuiz"
                    class="primary-btn">

                    Play Again

                </button>

                <button
                    id="goHome"
                    class="secondary-btn">

                    Home

                </button>

            </div>

        </div>

    </section>

    <!-- ===================== FOOTER ===================== -->

    <footer>

        <p>

            Made with ❤️ using HTML, CSS & JavaScript

        </p>

    </footer>

    <!-- ===================== JAVASCRIPT ===================== -->

    <script src="script.js"></script>

</body>

</html>
