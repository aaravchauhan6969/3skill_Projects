<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Properties | EstateHub</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
<div id="loader">

<div class="loader-box">

<div class="loader-circle"></div>

<h2>EstateHub</h2>

<p>Loading Dashboard...</p>

</div>

</div>
<header>

<nav class="navbar">

<div class="logo">
🏠 EstateHub
</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="properties.html">Properties</a></li>

<li><a href="dashboard.html">Dashboard</a></li>

<li><a href="agents.html">Agents</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

<button class="menu-btn">
☰
</button>

<button id="themeToggle" class="theme-btn">
🌙
</button>

</nav>

</header>

<section class="properties-page">

<h1>Property Management</h1>

<p>Browse and manage all listed properties.</p>

<div class="property-controls">

<input
type="text"
id="searchInput"
placeholder="Search by property name or city">

<select id="filterType">

<option value="All">All Types</option>

<option value="Villa">Villa</option>

<option value="Apartment">Apartment</option>

<option value="Commercial">Commercial</option>

<option value="Land">Land</option>

</select>

<button id="addPropertyBtn">
+ Add Property
</button>

</div>

<div id="propertyContainer" class="property-grid">

<!-- JavaScript will generate property cards here -->

</div>

<!-- ===========================
     PROPERTY DETAILS MODAL
=========================== -->

<div class="modal" id="propertyModal">

    <div class="modal-content">

        <span class="close-modal">&times;</span>

        <img id="modalImage" src="" alt="Property">

        <h2 id="modalTitle"></h2>

        <p id="modalCity"></p>

        <p id="modalType"></p>

        <p id="modalStatus"></p>

        <h3 id="modalPrice"></h3>

        <button class="primary-btn" id="closeModalBtn">
            Close
        </button>

    </div>

</div>

<!-- ===========================
     ADD PROPERTY MODAL
=========================== -->

<div class="modal" id="addModal">

    <div class="modal-content form-modal">

        <span class="close-add">&times;</span>

        <h2>Add New Property</h2>

        <form id="propertyForm">

            <input
                type="text"
                id="propertyName"
                placeholder="Property Name"
                required>

            <input
                type="text"
                id="propertyCity"
                placeholder="City"
                required>

            <select id="propertyType">

                <option value="Villa">Villa</option>
                <option value="Apartment">Apartment</option>
                <option value="Commercial">Commercial</option>
                <option value="Land">Land</option>

            </select>

            <input
                type="text"
                id="propertyPrice"
                placeholder="Price"
                required>

            <input
                type="text"
                id="propertyImage"
                placeholder="Image URL (Optional)">

            <button type="submit">
                Add Property
            </button>

        </form>

    </div>

</div>

</section>

<script src="js/app.js"></script>
<script src="js/properties.js"></script>
<!-- Toast Notification -->
<div id="toast"></div>
</body>

</html>
